<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
  <title id="title">OpenCave isolation boundary</title>
  <desc id="desc">Simplified architecture. OpenCode, a shell, and tools run inside a container with a persistent Linux filesystem. Only the selected project folder is mounted at /workspace/my-project; the rest of the host home directory and credentials are not mounted.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2ea043"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="998" height="458" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>

  <text x="500" y="48" text-anchor="middle" fill="#f0f6fc" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700">Linux Host</text>

  <rect x="50" y="96" width="690" height="300" rx="16" fill="#0d1f17" stroke="#2ea043" stroke-width="2"/>
  <text x="80" y="128" fill="#3fb950" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="600">Container</text>

  <rect x="80" y="140" width="630" height="100" rx="12" fill="#21262d" stroke="#30363d"/>
  <text x="395" y="182" text-anchor="middle" fill="#f0f6fc" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700">OpenCode + shell + tools</text>
  <text x="395" y="208" text-anchor="middle" fill="#8b949e" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18">Persistent Linux environment</text>

  <rect x="80" y="260" width="630" height="90" rx="12" fill="#21262d" stroke="#30363d"/>
  <text x="395" y="294" text-anchor="middle" fill="#f0f6fc" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="600">/workspace/my-project</text>
  <text x="395" y="318" text-anchor="middle" fill="#8b949e" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18">Writable bind mount</text>

  <rect x="770" y="260" width="180" height="90" rx="12" fill="#21262d" stroke="#30363d"/>
  <text x="860" y="294" text-anchor="middle" fill="#f0f6fc" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="600">Folder</text>
  <text x="860" y="318" text-anchor="middle" fill="#8b949e" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14">Shared resource</text>

  <line x1="710" y1="305" x2="770" y2="305" stroke="#2ea043" stroke-width="2" stroke-dasharray="6 6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <text x="500" y="440" text-anchor="middle" fill="#8b949e" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14">Simplified architecture</text>
</svg>
